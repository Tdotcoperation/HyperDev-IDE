<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1e1e" />
  <title>HyperDev IDE</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="titlebar">
      <div class="brand">HyperDev IDE</div>
      <div class="title-actions">
        <input id="fileUploadInput" type="file" multiple hidden />
        <input id="folderUploadInput" type="file" webkitdirectory directory multiple hidden />
        <button id="uploadFileBtn" class="ghost-btn" type="button">파일 업로드</button>
        <button id="uploadFolderBtn" class="ghost-btn" type="button">폴더 업로드</button>
        <button id="newFileBtn" class="ghost-btn" type="button">새 파일</button>
        <button id="downloadBtn" class="ghost-btn" type="button">↓ 다운로드</button>
        <button id="sandboxConnectBtn" class="ghost-btn sandbox-btn" type="button">☁ Sandbox 연결</button>
        <button id="runBtn" class="run-btn" type="button">▶ 실행</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-title">EXPLORER</div>
        <div class="project-name">▾ HYPERDEV</div>
        <div class="storage-note">프로젝트는 이 브라우저의 IndexedDB에 저장됩니다.</div>
        <div id="fileList" class="file-list"></div>
      </aside>

      <section class="main-area">
        <div id="tabs" class="tabs"></div>
        <div id="editor" class="editor"></div>

        <section class="panel">
          <div class="panel-header">
            <div class="panel-tabs">
              <button id="outputTabBtn" class="panel-tab active" type="button">OUTPUT</button>
              <button id="terminalTabBtn" class="panel-tab" type="button">TERMINAL</button>
            </div>
            <button id="clearPanelBtn" class="icon-btn" type="button">지우기</button>
          </div>
          <pre id="output" class="output" aria-live="polite"></pre>
          <div id="terminalPane" class="terminal-pane hidden">
            <pre id="terminalOutput" class="terminal-output">HyperDev Sandbox Terminal\nSandbox를 연결하면 명령을 실행할 수 있습니다.\n</pre>
            <form id="terminalForm" class="terminal-form">
              <span class="terminal-prompt">$</span>
              <input id="terminalInput" class="terminal-input" autocomplete="off" spellcheck="false" placeholder="pip install requests" />
            </form>
          </div>
        </section>
      </section>
    </main>

    <footer class="statusbar">
      <div class="status-left"><span id="languageStatus">Python</span></div>
      <div class="status-right"><span id="sandboxStatus">○ Sandbox 연결 안 됨</span><span id="engineStatus">준비</span><span>UTF-8</span></div>
    </footer>
  </div>

  <script>
    window.MonacoEnvironment = {
      getWorkerUrl: function () {
        const code = `self.MonacoEnvironment={baseUrl:'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/'};importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js');`;
        return URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script src="./app.js"></script>
</body>
</html>
